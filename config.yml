baseURL: https://omingale.in/
languageCode: en-us
title: Om Ingale
theme: ["PaperMod"]

params:
  defaultTheme: auto
  disableThemeToggle: False
  ShowReadingTime: true
  hideSummary: true
  goatcounterCode: omingale # dashboard: https://omingale.goatcounter.com

  homeInfoParams:
    Title: 👋Hello!
    Content: |
      Welcome to my blog!
      I write about all things related to data and software.



  socialIcons:
    - name: "github"
      url: "https://github.com/omingale0707"
    - name: "linkedin"
      url: "https://www.linkedin.com/in/omingale/"
    - name: "email"
      url: "mailto:omingale0707@gmail.com"

menus:
  main:
  - identifier: blog
    name: Blog
    pageRef: blog/
    weight: 1
  - identifier: about
    name: About Me
    pageRef: about/
    weight: 2
  - identifier: resume
    name: Resume
    pageRef: resume/
    weight: 3

markup:
  goldmark:
    renderer:
      unsafe: true # raw HTML in content, used by the resume page
  highlight:
    noClasses: false
